name: Issue Form
description: Please fill out this form to submit an issue
body:
  - type: markdown
    attributes:
      value: >
        Thanks for taking the time to fill out this issue. Please complete the
        form below to the best of your abilities
  - type: input
    id: duedate
    attributes:
      label: Due Date
      description: Please enter your best estimate for when you expect/need this issue
        to be resolved
      placeholder: 12/31/9999
    validations:
      required: true
  - type: checkboxes
    id: internal_external
    attributes:
      label: Did this request come from or is it for someone outside of the Finance team?
      options:
        - label: Yes (External Request)
        - label: No (Internal Request)
    validations:
      required: true
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      description: Please select which workstreams are involved in this issue
      multiple: true
      options:
        - Sigma
        - Domo
        - Delphi
        - Branch Claims Model
        - Forecasting/Planning
        - Investor Relations
        - Regulatory
        - Expense Forecasting
        - Metric Reporting
        - Ember
        - Agency
        - Other, please list in the next section
    validations:
      required: true
  - type: input
    id: workstream_other
    attributes:
      label: If selected Other, please add the type of issue
      description: (Optional)
  - type: dropdown
    id: type
    attributes:
      label: Type of Issue
      multiple: false
      options:
        - Bug Fix
        - Improvement
        - Recurring Reporting
        - Request
        - Other
  - type: input
    id: type_other
    attributes:
      label: If selected Other, please add the type of issue
      description: (Optional)
  - type: textarea
    id: description
    attributes:
      label: Description
      placeholder: Please add a brief description of the work that needs to be done
    validations:
      required: true
  - type: markdown
    attributes:
      value: > 
        **Please assign this issue to yourself or someone who will be responsible for attending to this issue.**
      
